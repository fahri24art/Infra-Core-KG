# HTTPS reverse proxy ke backend HRIS
server {
    listen 443 ssl http2;
    server_name hris.tricentrumfortuna.com;

    ssl_certificate /etc/letsencrypt/live/hris.tricentrumfortuna.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hris.tricentrumfortuna.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location / {
        # Proxy ke backend HRIS
        proxy_pass https://192.168.1.29;

        # Header wajib biar Laravel/Apache tau hostname asli
        proxy_set_header Host hris.tricentrumfortuna.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSL SNI biar backend pilih vhost & cert yang benar
        proxy_ssl_server_name on;
        proxy_ssl_name hris.tricentrumfortuna.com;

        # Disable redirect bawaan proxy
        proxy_redirect off;

        # Timeout & buffer untuk request berat
        proxy_buffers 4 256k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 90;
        proxy_send_timeout    90;
        proxy_read_timeout    90;
        send_timeout          90;

        # Upload file besar
        client_max_body_size 50M;
    }
}
