# Blok 1: Redirect HTTP (80) & Port 66 ke HTTPS
server {
    listen 80;
    server_name aset.tricentrumfortuna.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;  # untuk Certbot verifikasi
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Blok 2: Utama (HTTPS 443)
server {
    listen 443 ssl;
    server_name aset.tricentrumfortuna.com;

    # Sertifikat SSL
    ssl_certificate /etc/letsencrypt/live/aset.tricentrumfortuna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aset.tricentrumfortuna.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # GANTI ke http jika backend 1.66 tidak pakai SSL sendiri
        proxy_pass http://192.168.1.66:80; 

        proxy_set_header Host $host; # Gunakan domain asli (aset.tricentrumfortuna.com)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jika backend MEMANG pakai HTTPS, aktifkan ini:
        proxy_ssl_verify off; # Penting jika backend pakai self-signed cert
        proxy_ssl_server_name on;

        # Optimasi Buffer
        proxy_buffers 4 256k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
        
        # Timeout (Besarkan sedikit agar tidak gampang putus di Telkomsel)
        proxy_connect_timeout 300;
        proxy_send_timeout    300;
        proxy_read_timeout    300;
    }
}# --- BLOK HTTP (Port 80) ---
