# ===============================
# HTTPS Reverse Proxy iDempiere
# ===============================
server {
    listen 443 ssl http2;
    server_name idempiere.tricentrumfortuna.com;

    ssl_certificate     /etc/letsencrypt/live/idempiere.tricentrumfortuna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idempiere.tricentrumfortuna.com/privkey.pem;

    ## ===============================
    ## Reverse Proxy
    ## ===============================
    location / {
        proxy_pass https://192.168.1.8:8443;
        proxy_http_version 1.1;

        ## Host & Client Info
        proxy_set_header Host 192.168.1.8;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        ## WebSocket / ZK
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        ## SSL backend (self-signed OK)
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        ## Timeout (iDempiere berat)
        proxy_connect_timeout 300;
        proxy_send_timeout    300;
        proxy_read_timeout    300;

        proxy_buffering off;
    }
}
server {
    listen 80;
    server_name idempiere.tricentrumfortuna.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    # GANTI: Hapus 'http2' karena sering memicu 'bad key share' di Telkomsel
    listen 443 ssl; 
    server_name idempiere.tricentrumfortuna.com;

    ssl_certificate /etc/letsencrypt/live/idempiere.tricentrumfortuna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idempiere.tricentrumfortuna.com/privkey.pem;

    # GANTI: Paksa pakai TLSv1.2 saja (Hapus 1.3 untuk bypass error key share)
    ssl_protocols TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # TAMBAHKAN: Cipher yang lebih 'umum' agar jabat tangan SSL lancar
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass https://192.168.1.8:8443;
        
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;

        # Timeout tetap panjang
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}# Redirect HTTP ke HTTPS
