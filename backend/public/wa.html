<!DOCTYPE html>
<html>
<head>
    <title>TCF Local WA Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fab fa-whatsapp mr-2"></i> Local WA Monitor</h1>
        <div id="status" class="px-3 py-1 rounded-full text-sm bg-blue-700">Checking...</div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 space-y-3" id="logs">
        <!-- Logs will appear here -->
    </main>

    <script>
        async function update() {
            try {
                // Fetch Logs
                const resLogs = await fetch('/api/wa-logs');
                const logs = await resLogs.json();
                const container = document.getElementById('logs');
                container.innerHTML = '';
                
                logs.reverse().forEach(log => {
                    const div = document.createElement('div');
                    div.className = `flex ${log.direction === 'IN' ? 'justify-start' : 'justify-end'}`;
                    div.innerHTML = `
                        <div class="max-w-[80%] p-3 rounded-lg ${log.direction === 'IN' ? 'bg-white text-gray-800 shadow' : 'bg-green-500 text-white shadow'}">
                            <div class="text-[10px] opacity-70 mb-1">${log.sender_name || log.sender_number}</div>
                            <div class="text-sm font-medium">${log.message_text}</div>
                            <div class="text-[9px] text-right mt-1 opacity-50">${new Date(log.timestamp).toLocaleTimeString()}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });

                // Fetch Status
                const resStatus = await fetch('/api/wa-status');
                const st = await resStatus.json();
                const el = document.getElementById('status');
                el.innerText = st.status;
                el.className = `px-3 py-1 rounded-full text-sm ${st.status === 'CONNECTED' ? 'bg-green-500' : 'bg-red-500'}`;
            } catch (e) {
                console.error(e);
            }
        }
        setInterval(update, 2000);
        update();
    </script>
</body>
</html>
